name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (keeps the queue short on busy PRs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install PortAudio
        # sounddevice loads libportaudio at import time; mypy follows imports
        # but never executes them, yet keeping the environment identical to
        # the test job avoids "works in one job only" surprises.
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          # The project is developed on Windows; keep one Windows leg so
          # Windows-only code paths (e.g. src/cuda_dlls.py) stay exercised.
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install PortAudio
        if: runner.os == 'Linux'
        # sounddevice loads libportaudio at import time; pipeline.py (and so
        # the chat_web tests) import it even though no audio device is used.
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dev dependencies
        # Deliberately requirements-dev.txt, not requirements-gpu.txt --
        # the whole suite mocks GPU/Ollama/Piper (see tests/conftest.py),
        # so CI never needs the ~1.3GB of CUDA wheels.
        run: pip install -r requirements-dev.txt

      - name: Test
        run: pytest -v

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: voice-chatbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test /api/health
        # Ollama and Piper voices are intentionally absent: /api/health only
        # needs the Flask app to import and serve.
        run: |
          docker run -d --name vc -p 127.0.0.1:5006:5006 voice-chatbot:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5006/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs vc
          exit 1
