name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        # Deliberately requirements-dev.txt, not requirements-gpu.txt --
        # the whole suite mocks GPU/Ollama/Piper (see tests/conftest.py),
        # so CI never needs the ~1.3GB of CUDA wheels.
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v
