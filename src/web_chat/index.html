<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Voice Chatbot</title>
<style>
  :root{
    --bg-0:#0b0d14; --card:#171b28cc; --card-border:#2a3040;
    --text:#eef1f8; --text-dim:#9aa3b8; --text-faint:#5c6479;
    --accent:#60a5fa; --accent-dim:#60a5fa33;
    --user-bubble:#2c5fd6; --assistant-bubble:#1c2233;
    --danger:#f87171; --success:#34d399; --warn:#fbbf24;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--text);
    background:
      radial-gradient(60vmax 60vmax at 15% -10%, #3b82f622, transparent 60%),
      radial-gradient(70vmax 70vmax at 100% 100%, #a78bfa1f, transparent 60%),
      var(--bg-0);
    font-family: -apple-system, "Segoe UI", ui-sans-serif, system-ui, Roboto, Arial, sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }

  header{
    display:flex; align-items:center; gap:12px; padding:14px 20px;
    border-bottom:1px solid var(--card-border); flex-shrink:0;
    background:#0b0d14aa; backdrop-filter:blur(8px); z-index:5;
  }
  header .avatar{
    width:38px; height:38px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent), #818cf8);
    display:flex; align-items:center; justify-content:center; font-size:1.2rem;
    flex-shrink:0;
  }
  header .title{ font-weight:700; font-size:1.02rem; }
  header .status{ font-size:0.78rem; color:var(--text-dim); display:flex; align-items:center; gap:6px; }
  .status-dot{ width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex-shrink:0; }
  .status-dot.ok{ background:var(--success); box-shadow:0 0 8px #34d39988; }
  .status-dot.warn{ background:var(--warn); box-shadow:0 0 8px #fbbf2488; }
  .status-dot.err{ background:var(--danger); box-shadow:0 0 8px #f8717188; }
  header .spacer{ flex:1; }
  header .model-badge{
    font-size:0.72rem; color:var(--text-dim); background:#ffffff0d;
    border:1px solid #ffffff1a; padding:4px 10px; border-radius:999px;
  }

  #messages{
    flex:1; overflow-y:auto; padding:24px 16px 12px;
    display:flex; flex-direction:column; gap:14px;
    scroll-behavior:smooth;
  }
  #messages::-webkit-scrollbar{ width:8px; }
  #messages::-webkit-scrollbar-thumb{ background:#ffffff1a; border-radius:8px; }

  .row{ display:flex; gap:10px; max-width:780px; width:100%; margin:0 auto; align-items:flex-end; }
  .row.user{ flex-direction:row-reverse; }
  .row .avatar-sm{
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:0.85rem;
  }
  .row.assistant .avatar-sm{ background:linear-gradient(135deg, var(--accent), #818cf8); }
  .row.user .avatar-sm{ background:#ffffff14; }

  .bubble{
    padding:12px 16px; border-radius:var(--radius); line-height:1.5; font-size:0.95rem;
    max-width:calc(100% - 46px); white-space:pre-wrap; word-wrap:break-word;
    animation:pop-in .25s cubic-bezier(.2,.9,.25,1) both;
  }
  @keyframes pop-in{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .row.user .bubble{ background:var(--user-bubble); border-bottom-right-radius:4px; }
  .row.assistant .bubble{ background:var(--assistant-bubble); border:1px solid var(--card-border); border-bottom-left-radius:4px; }
  .row.rejected .bubble{
    background:transparent; border:1px dashed #ffffff2a; color:var(--text-faint);
    font-style:italic; font-size:0.85rem;
  }
  .bubble .meta{
    display:block; margin-top:6px; font-size:0.72rem; color:var(--text-faint); font-style:normal;
  }
  .bubble .replay-btn{
    background:none; border:none; color:inherit; opacity:0.6; cursor:pointer;
    font-size:0.85rem; padding:0; margin-left:8px; vertical-align:middle;
  }
  .bubble .replay-btn:hover{ opacity:1; }

  .typing-dots{ display:inline-flex; gap:4px; align-items:center; height:1em; }
  .typing-dots span{
    width:6px; height:6px; border-radius:50%; background:var(--text-dim);
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){ animation-delay:.2s; }
  .typing-dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }

  #empty-state{
    margin:auto; text-align:center; color:var(--text-dim); max-width:420px; padding:20px;
  }
  #empty-state .big-icon{ font-size:2.6rem; margin-bottom:10px; }
  #empty-state h2{ color:var(--text); margin:0 0 8px; font-size:1.2rem; }
  #empty-state p{ font-size:0.88rem; line-height:1.6; margin:0; }

  footer{
    flex-shrink:0; padding:14px 16px 20px;
    border-top:1px solid var(--card-border); background:#0b0d14aa; backdrop-filter:blur(8px);
  }
  .composer{
    max-width:780px; margin:0 auto; display:flex; align-items:flex-end; gap:10px;
    background:var(--card); border:1px solid var(--card-border); border-radius:22px;
    padding:8px 8px 8px 18px;
  }
  #text-input{
    flex:1; background:none; border:none; outline:none; color:var(--text);
    font-size:0.95rem; font-family:inherit; resize:none; max-height:120px; padding:8px 0;
    line-height:1.4;
  }
  #text-input::placeholder{ color:var(--text-faint); }

  .icon-btn{
    width:40px; height:40px; border-radius:50%; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:1.05rem;
    background:#ffffff10; color:var(--text); flex-shrink:0; transition:all .15s ease;
  }
  .icon-btn:hover{ background:#ffffff1c; }
  .icon-btn:disabled{ opacity:.4; cursor:not-allowed; }
  #btn-send{ background:linear-gradient(135deg, var(--accent), #818cf8); color:#0b0d14; }
  #btn-mic.recording{
    background:linear-gradient(135deg, var(--danger), #ef4444); color:#fff;
    animation:mic-pulse 1.1s ease-in-out infinite;
  }
  @keyframes mic-pulse{
    0%,100%{ box-shadow:0 0 0 0 #f8717155; }
    50%{ box-shadow:0 0 0 10px #f8717100; }
  }

  .live-status{
    max-width:780px; margin:0 auto 8px; text-align:center; font-size:0.8rem;
    color:var(--text-dim); min-height:1.2em;
  }

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%);
    background:#1c2233; border:1px solid #ffffff22; color:var(--text);
    padding:12px 20px; border-radius:12px; font-size:0.85rem; box-shadow:0 10px 30px -10px #000000aa;
    animation:toast-in .25s ease both; z-index:20;
  }
  .toast.error{ border-color:#f8717166; color:#fecaca; }
  @keyframes toast-in{ from{opacity:0; transform:translate(-50%, 10px);} to{opacity:1; transform:translate(-50%,0);} }
</style>
</head>
<body>
  <header>
    <div class="avatar">🤖</div>
    <div>
      <div class="title">Local Voice Chatbot</div>
      <div class="status"><span class="status-dot" id="status-dot"></span><span id="status-text">Connecting...</span></div>
    </div>
    <div class="spacer"></div>
    <div class="model-badge" id="model-badge">faster-whisper + Ollama + Piper</div>
  </header>

  <div id="messages">
    <div id="empty-state">
      <div class="big-icon">🎙️</div>
      <h2>Talk to your local assistant</h2>
      <p>Everything runs on this machine — speech recognition, the language model,
         and text-to-speech. Tap the mic and speak, or just type below.</p>
    </div>
  </div>

  <footer>
    <div class="live-status" id="live-status"></div>
    <div class="composer">
      <textarea id="text-input" rows="1" placeholder="Type a message, or tap the mic to speak..."></textarea>
      <button id="btn-mic" class="icon-btn" title="Record voice message">🎤</button>
      <button id="btn-send" class="icon-btn" title="Send">➤</button>
    </div>
  </footer>

<script>
const messagesEl = document.getElementById('messages');
const emptyState = document.getElementById('empty-state');
const textInput = document.getElementById('text-input');
const btnMic = document.getElementById('btn-mic');
const btnSend = document.getElementById('btn-send');
const liveStatus = document.getElementById('live-status');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');

let history = [];           // [{role, content}, ...] sent to /api/respond
let stream = null;          // mic MediaStream, requested lazily on first mic tap
let mediaRecorder = null;
let chunks = [];
let isRecording = false;
let isBusy = false;         // true while transcribing/responding/synthesizing

function setStatus(state, text) {
  statusDot.className = 'status-dot' + (state ? ' ' + state : '');
  statusText.textContent = text;
}

function setLive(text) { liveStatus.textContent = text || ''; }

function showToast(msg, isError) {
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideEmptyState() {
  if (emptyState.parentNode) emptyState.remove();
}

function addRow(role, text, opts) {
  opts = opts || {};
  hideEmptyState();
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const avatar = document.createElement('div');
  avatar.className = 'avatar-sm';
  avatar.textContent = role === 'user' ? '🗣️' : (role === 'rejected' ? '?' : '🤖');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  if (opts.meta) {
    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = opts.meta;
    bubble.appendChild(meta);
  }
  row.appendChild(avatar);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollToBottom();
  return bubble;
}

function addTypingIndicator() {
  hideEmptyState();
  const row = document.createElement('div');
  row.className = 'row assistant';
  row.id = 'typing-row';
  const avatar = document.createElement('div');
  avatar.className = 'avatar-sm';
  avatar.textContent = '🤖';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
  row.appendChild(avatar);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollToBottom();
  return bubble;
}

function addReplayButton(bubble, audioBlob) {
  const btn = document.createElement('button');
  btn.className = 'replay-btn';
  btn.textContent = '🔊 Replay';
  btn.onclick = () => new Audio(URL.createObjectURL(audioBlob)).play();
  bubble.appendChild(document.createElement('br'));
  bubble.appendChild(btn);
}

function applyWhisperDevice(device) {
  if (device) setStatus('ok', 'Ready · STT on ' + device.toUpperCase());
}

async function checkHealth() {
  try {
    const res = await fetch('/api/health');
    const data = await res.json();
    // Whisper loads lazily on the first transcription request, so
    // whisper_device is still null right after the server starts --
    // showing "STT on ?" here would look broken rather than pending.
    // The badge fills in for real once /api/transcribe reports a device.
    if (data.whisper_device) {
      applyWhisperDevice(data.whisper_device);
    } else {
      setStatus('ok', 'Ready');
    }
  } catch (err) {
    setStatus('err', 'Server unreachable');
  }
}

async function synthesizeAndPlay(text) {
  try {
    const res = await fetch('/api/tts', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) throw new Error((await res.json()).error || ('HTTP ' + res.status));
    const blob = await res.blob();
    const audio = new Audio(URL.createObjectURL(blob));
    await audio.play().catch(() => {}); // autoplay can be blocked; not fatal
    return blob;
  } catch (err) {
    showToast('TTS failed: ' + err.message, true);
    return null;
  }
}

async function sendToLLM(userText) {
  isBusy = true;
  setControlsEnabled(false);
  setLive('Thinking...');
  const typingBubble = addTypingIndicator();
  let fullText = '';
  try {
    const res = await fetch('/api/respond', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: userText, history }),
    });
    if (!res.body) throw new Error('Streaming not supported by this browser.');
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let first = true;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const piece = decoder.decode(value, { stream: true });
      if (!piece) continue;
      if (first) { typingBubble.textContent = ''; first = false; }
      fullText += piece;
      typingBubble.textContent = fullText;
      scrollToBottom();
    }
    if (!fullText.trim()) fullText = '(no response)';
    history.push({ role: 'user', content: userText });
    history.push({ role: 'assistant', content: fullText });

    setLive('Speaking...');
    const audioBlob = await synthesizeAndPlay(fullText);
    if (audioBlob) addReplayButton(typingBubble, audioBlob);
  } catch (err) {
    typingBubble.textContent = 'Error: ' + err.message;
    showToast(err.message, true);
  } finally {
    setLive('');
    isBusy = false;
    setControlsEnabled(true);
    document.getElementById('typing-row')?.removeAttribute('id');
  }
}

async function handleUserText(text) {
  text = text.trim();
  if (!text) return;
  addRow('user', text);
  await sendToLLM(text);
}

function setControlsEnabled(enabled) {
  btnSend.disabled = !enabled;
  btnMic.disabled = !enabled;
  textInput.disabled = !enabled;
}

// ---- text input ----
btnSend.addEventListener('click', () => {
  const text = textInput.value;
  textInput.value = '';
  textInput.style.height = 'auto';
  handleUserText(text);
});
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    btnSend.click();
  }
});
textInput.addEventListener('input', () => {
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
});

// ---- voice input ----
function pickMimeType() {
  const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/ogg'];
  for (const c of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}

async function ensureMic() {
  if (stream) return stream;
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  return stream;
}

btnMic.addEventListener('click', async () => {
  if (isBusy) return;
  if (!isRecording) {
    try {
      await ensureMic();
    } catch (err) {
      showToast('Microphone access denied: ' + err.message, true);
      return;
    }
    chunks = [];
    const mimeType = pickMimeType();
    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = onRecordingStopped;
    mediaRecorder.start();
    isRecording = true;
    btnMic.classList.add('recording');
    btnMic.textContent = '⏹';
    setLive('Listening... tap to stop');
  } else {
    mediaRecorder.stop();
    isRecording = false;
    btnMic.classList.remove('recording');
    btnMic.textContent = '🎤';
  }
});

async function onRecordingStopped() {
  const mimeType = mediaRecorder.mimeType || 'audio/webm';
  const blob = new Blob(chunks, { type: mimeType });
  if (blob.size < 800) {
    setLive('');
    showToast('Recording too short.', true);
    return;
  }
  isBusy = true;
  setControlsEnabled(false);
  setLive('Transcribing...');
  try {
    const form = new FormData();
    const ext = mimeType.includes('ogg') ? 'ogg' : 'webm';
    form.append('audio', blob, `clip.${ext}`);
    const res = await fetch('/api/transcribe', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
    applyWhisperDevice(data.whisper_device); // fills in "STT on ?" once known

    if (!data.accepted) {
      addRow('rejected', '"' + data.text + '"', { meta: `low confidence (${data.avg_logprob.toFixed(2)}) -- not sent to the model` });
      setLive('');
      const askAgain = "Sorry, could you say that again?";
      const bubble = addRow('assistant', askAgain);
      const clip = await synthesizeAndPlay(askAgain);
      if (clip) addReplayButton(bubble, clip);
      isBusy = false;
      setControlsEnabled(true);
      return;
    }

    addRow('user', data.text, { meta: `confidence ${data.avg_logprob.toFixed(2)}` });
    isBusy = false; // sendToLLM will re-lock controls
    await sendToLLM(data.text);
  } catch (err) {
    showToast(err.message, true);
    setLive('');
    isBusy = false;
    setControlsEnabled(true);
  }
}

checkHealth();
</script>
</body>
</html>
