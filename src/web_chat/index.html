<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Voice Chatbot</title>
<style>
  :root{
    /* Tells the browser this page is dark-themed, so native controls it
       renders itself -- the language <select>'s dropdown popup chief among
       them -- use a dark UA stylesheet instead of defaulting to a
       jarring white-on-dark popup no amount of our own CSS can reach
       (a native <option> list's colors aren't fully stylable cross-browser). */
    color-scheme: dark;
    --bg-0:#0b0d14; --card:#171b28cc; --card-border:#2a3040;
    --text:#eef1f8; --text-dim:#9aa3b8; --text-faint:#5c6479;
    --accent:#60a5fa; --accent-dim:#60a5fa33;
    --user-bubble:#2c5fd6; --assistant-bubble:#1c2233;
    --danger:#f87171; --success:#34d399; --warn:#fbbf24;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--text);
    background:
      radial-gradient(60vmax 60vmax at 15% -10%, #3b82f622, transparent 60%),
      radial-gradient(70vmax 70vmax at 100% 100%, #a78bfa1f, transparent 60%),
      var(--bg-0);
    font-family: -apple-system, "Segoe UI", ui-sans-serif, system-ui, Roboto, Arial, sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }

  header{
    display:flex; align-items:center; gap:12px; padding:14px 20px;
    border-bottom:1px solid var(--card-border); flex-shrink:0;
    background:#0b0d14aa; backdrop-filter:blur(8px); z-index:5;
  }
  header .avatar{
    width:38px; height:38px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent), #818cf8);
    display:flex; align-items:center; justify-content:center; font-size:1.2rem;
    flex-shrink:0;
  }
  header .title{ font-weight:700; font-size:1.02rem; }
  header .status{ font-size:0.78rem; color:var(--text-dim); display:flex; align-items:center; gap:6px; }
  .status-dot{ width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex-shrink:0; }
  .status-dot.ok{ background:var(--success); box-shadow:0 0 8px #34d39988; }
  .status-dot.warn{ background:var(--warn); box-shadow:0 0 8px #fbbf2488; }
  .status-dot.err{ background:var(--danger); box-shadow:0 0 8px #f8717188; }
  header .spacer{ flex:1; }
  header .model-badge{
    font-size:0.72rem; color:var(--text-dim); background:#ffffff0d;
    border:1px solid #ffffff1a; padding:4px 10px; border-radius:999px;
  }
  #lang-select{
    font-size:0.78rem; color:var(--text); background:#ffffff0d;
    border:1px solid #ffffff1a; padding:5px 10px; border-radius:999px;
    font-family:inherit; cursor:pointer;
  }
  #lang-select:focus{ outline:1px solid var(--accent); }
  /* Belt-and-suspenders alongside :root's color-scheme:dark above -- some
     browsers still let the *closed* select's own background/text through
     to each <option> row even in a dark popup, so pin them explicitly too. */
  #lang-select option{ background:#171b28; color:var(--text); }

  #messages{
    flex:1; overflow-y:auto; padding:24px 16px 12px;
    display:flex; flex-direction:column; gap:14px;
    scroll-behavior:smooth;
  }
  #messages::-webkit-scrollbar{ width:8px; }
  #messages::-webkit-scrollbar-thumb{ background:#ffffff1a; border-radius:8px; }

  .row{ display:flex; gap:10px; max-width:780px; width:100%; margin:0 auto; align-items:flex-end; }
  .row.user{ flex-direction:row-reverse; }
  .row .avatar-sm{
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:0.85rem;
  }
  .row.assistant .avatar-sm{ background:linear-gradient(135deg, var(--accent), #818cf8); }
  .row.user .avatar-sm{ background:#ffffff14; }

  .bubble{
    padding:12px 16px; border-radius:var(--radius); line-height:1.5; font-size:0.95rem;
    max-width:calc(100% - 46px); white-space:pre-wrap; word-wrap:break-word;
    animation:pop-in .25s cubic-bezier(.2,.9,.25,1) both;
  }
  @keyframes pop-in{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .row.user .bubble{ background:var(--user-bubble); border-bottom-right-radius:4px; }
  .row.assistant .bubble{ background:var(--assistant-bubble); border:1px solid var(--card-border); border-bottom-left-radius:4px; }
  .row.rejected .bubble{
    background:transparent; border:1px dashed #ffffff2a; color:var(--text-faint);
    font-style:italic; font-size:0.85rem;
  }
  .bubble .meta{
    display:block; margin-top:6px; font-size:0.72rem; color:var(--text-faint); font-style:normal;
  }
  .bubble .replay-btn{
    background:none; border:none; color:inherit; opacity:0.6; cursor:pointer;
    font-size:0.85rem; padding:0; margin-left:8px; vertical-align:middle;
  }
  .bubble .replay-btn:hover{ opacity:1; }

  .bubble .correct-btn{
    background:none; border:none; color:inherit; opacity:0.55; cursor:pointer;
    font-size:0.78rem; padding:0; margin-left:8px; vertical-align:middle;
  }
  .bubble .correct-btn:hover{ opacity:1; }
  .bubble .correction-saved{
    display:block; margin-top:6px; font-size:0.72rem; color:var(--success); font-style:normal;
  }
  .correction-form{ margin-top:8px; }
  .correction-form textarea{
    width:100%; min-height:52px; resize:vertical; border-radius:10px;
    border:1px solid #ffffff2a; background:#00000022; color:inherit;
    font:inherit; font-size:0.9rem; padding:8px; box-sizing:border-box;
  }
  .correction-form .correction-actions{ margin-top:6px; display:flex; gap:8px; }
  .correction-form button{
    border:none; border-radius:8px; padding:5px 12px; font-size:0.78rem; cursor:pointer;
  }
  .correction-form .save-btn{ background:var(--accent); color:#0b0d14; }
  .correction-form .cancel-btn{ background:#ffffff14; color:inherit; }
  .suggestion-note{
    display:block; margin-top:6px; font-size:0.78rem; color:var(--text-dim); font-style:normal;
  }
  .suggestion-note button{
    background:none; border:none; color:var(--accent); cursor:pointer;
    font-size:0.78rem; padding:0; text-decoration:underline;
  }

  .typing-dots{ display:inline-flex; gap:4px; align-items:center; height:1em; }
  .typing-dots span{
    width:6px; height:6px; border-radius:50%; background:var(--text-dim);
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){ animation-delay:.2s; }
  .typing-dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }

  #empty-state{
    margin:auto; text-align:center; color:var(--text-dim); max-width:420px; padding:20px;
  }
  #empty-state .big-icon{ font-size:2.6rem; margin-bottom:10px; }
  #empty-state h2{ color:var(--text); margin:0 0 8px; font-size:1.2rem; }
  #empty-state p{ font-size:0.88rem; line-height:1.6; margin:0; }

  footer{
    flex-shrink:0; padding:14px 16px 20px;
    border-top:1px solid var(--card-border); background:#0b0d14aa; backdrop-filter:blur(8px);
  }
  .composer{
    max-width:780px; margin:0 auto; display:flex; align-items:flex-end; gap:10px;
    background:var(--card); border:1px solid var(--card-border); border-radius:22px;
    padding:8px 8px 8px 18px;
  }
  #text-input{
    flex:1; background:none; border:none; outline:none; color:var(--text);
    font-size:0.95rem; font-family:inherit; resize:none; max-height:120px; padding:8px 0;
    line-height:1.4;
  }
  #text-input::placeholder{ color:var(--text-faint); }

  .icon-btn{
    width:40px; height:40px; border-radius:50%; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:1.05rem;
    background:#ffffff10; color:var(--text); flex-shrink:0; transition:all .15s ease;
  }
  .icon-btn:hover{ background:#ffffff1c; }
  .icon-btn:disabled{ opacity:.4; cursor:not-allowed; }
  #btn-send{ background:linear-gradient(135deg, var(--accent), #818cf8); color:#0b0d14; }
  #btn-mic.recording{
    background:linear-gradient(135deg, var(--danger), #ef4444); color:#fff;
    animation:mic-pulse 1.1s ease-in-out infinite;
  }
  #btn-handsfree.active{
    background:linear-gradient(135deg, var(--accent), #818cf8); color:#0b0d14;
  }
  #btn-wakeword.active{
    background:linear-gradient(135deg, var(--accent), #818cf8); color:#0b0d14;
  }
  @keyframes mic-pulse{
    0%,100%{ box-shadow:0 0 0 0 #f8717155; }
    50%{ box-shadow:0 0 0 10px #f8717100; }
  }

  .live-status{
    max-width:780px; margin:0 auto 8px; text-align:center; font-size:0.8rem;
    color:var(--text-dim); min-height:1.2em;
  }

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%);
    background:#1c2233; border:1px solid #ffffff22; color:var(--text);
    padding:12px 20px; border-radius:12px; font-size:0.85rem; box-shadow:0 10px 30px -10px #000000aa;
    animation:toast-in .25s ease both; z-index:20;
  }
  .toast.error{ border-color:#f8717166; color:#fecaca; }
  @keyframes toast-in{ from{opacity:0; transform:translate(-50%, 10px);} to{opacity:1; transform:translate(-50%,0);} }
</style>
</head>
<body>
  <header>
    <div class="avatar">🤖</div>
    <div>
      <div class="title">Local Voice Chatbot</div>
      <div class="status"><span class="status-dot" id="status-dot"></span><span id="status-text">Connecting...</span></div>
    </div>
    <div class="spacer"></div>
    <select id="lang-select" title="Spoken/reply language">
      <option value="auto">Auto-detect</option>
      <option value="en">English</option>
      <option value="hi">Hindi</option>
      <option value="ta">Tamil</option>
    </select>
    <div class="model-badge" id="model-badge">faster-whisper + Ollama + Piper</div>
  </header>

  <div id="messages">
    <div id="empty-state">
      <div class="big-icon">🎙️</div>
      <h2>Talk to your local assistant</h2>
      <p>Tap the mic and speak, or type below.</p>
    </div>
  </div>

  <footer>
    <div class="live-status" id="live-status"></div>
    <div class="composer">
      <textarea id="text-input" rows="1" placeholder="Type a message, or tap the mic to speak..."></textarea>
      <button id="btn-handsfree" class="icon-btn" title="Hands-free mode: keep listening after each reply">🔁</button>
      <button id="btn-wakeword" class="icon-btn" title='Wake-word mode: say "hey chatbot" to start listening'>👂</button>
      <button id="btn-mic" class="icon-btn" title="Record voice message">🎤</button>
      <button id="btn-send" class="icon-btn" title="Send">➤</button>
    </div>
  </footer>

<script>
const messagesEl = document.getElementById('messages');
const emptyState = document.getElementById('empty-state');
const textInput = document.getElementById('text-input');
const btnMic = document.getElementById('btn-mic');
const btnSend = document.getElementById('btn-send');
const btnHandsFree = document.getElementById('btn-handsfree');
const btnWakeWord = document.getElementById('btn-wakeword');
const liveStatus = document.getElementById('live-status');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const langSelect = document.getElementById('lang-select');

// "auto" lets Whisper detect English/Hindi/Tamil per spoken utterance --
// selecting a specific language instead forces STT to that language (useful
// when a short/ambiguous clip auto-detects wrong) and is also the language
// used for typed (non-voice) messages, since there's nothing to detect.
let selectedLanguage = 'auto';
langSelect.addEventListener('change', () => { selectedLanguage = langSelect.value; });

let history = [];           // [{role, content}, ...] sent to /api/respond
let stream = null;          // mic MediaStream, requested lazily on first mic tap
let mediaRecorder = null;
let chunks = [];
let isRecording = false;
let isBusy = false;         // true while transcribing/responding/synthesizing
let handsFreeMode = false;  // when on, listening restarts automatically after each reply finishes speaking
let wakeWordMode = false;   // when on, idle listening re-arms whenever the app returns to idle (see maybeRearmWakeListening)

// Local, no-auth identity for the continuous-learning layer (see
// src/learning/). profileId survives across tabs/restarts on this
// browser; sessionId is fresh per tab load. Neither is sent anywhere off
// this machine -- they're just partition keys the server uses to keep
// one person's corrections from affecting anyone else's. A server with
// learning disabled (the default) ignores both.
function getOrCreateId(storage, key) {
  try {
    let id = storage.getItem(key);
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2));
      storage.setItem(key, id);
    }
    return id;
  } catch (err) {
    return 'local'; // storage unavailable (private mode, etc.) -- server falls back too
  }
}
const profileId = getOrCreateId(localStorage, 'vc_profile_id');
const sessionId = getOrCreateId(sessionStorage, 'vc_session_id');

function setStatus(state, text) {
  statusDot.className = 'status-dot' + (state ? ' ' + state : '');
  statusText.textContent = text;
}

function setLive(text) { liveStatus.textContent = text || ''; }

function showToast(msg, isError) {
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideEmptyState() {
  if (emptyState.parentNode) emptyState.remove();
}

function addRow(role, text, opts) {
  opts = opts || {};
  hideEmptyState();
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const avatar = document.createElement('div');
  avatar.className = 'avatar-sm';
  avatar.textContent = role === 'user' ? '🗣️' : (role === 'rejected' ? '?' : '🤖');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  if (opts.meta) {
    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = opts.meta;
    bubble.appendChild(meta);
  }
  row.appendChild(avatar);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollToBottom();
  if (opts.correction) attachCorrectionUI(bubble, text, opts.correction);
  return bubble;
}

// ---- transcript correction (continuous-learning feedback) ----
// Only attached to voice-transcribed user bubbles (opts.correction is set
// only when the server actually returned an event_id -- i.e. the learning
// layer is enabled server-side). Typed messages have no STT output to
// correct, so they never get this affordance.
function escapeForWordRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function applyPhrase(text, originalPhrase, correctedPhrase) {
  const pattern = new RegExp('\\b' + escapeForWordRegex(originalPhrase) + '\\b', 'i');
  return pattern.test(text) ? text.replace(pattern, correctedPhrase) : text;
}

function attachCorrectionUI(bubble, displayedText, correction) {
  const btn = document.createElement('button');
  btn.className = 'correct-btn';
  btn.textContent = '✏️ Correct';
  btn.onclick = () => openCorrectionForm(bubble, displayedText, correction, btn);
  bubble.appendChild(document.createElement('br'));
  bubble.appendChild(btn);

  const suggestions = correction.suggestions || [];
  if (suggestions.length) {
    // Keep it simple: surface only the strongest suggestion inline, as a
    // low-confidence "did you mean" rather than applying it -- the user
    // still has to review and save it like any other correction.
    const top = suggestions[0];
    const note = document.createElement('div');
    note.className = 'suggestion-note';
    note.textContent = 'Did you mean "' + top.corrected_phrase + '" instead of "' + top.original_phrase + '"? ';
    const reviewBtn = document.createElement('button');
    reviewBtn.textContent = 'Review';
    reviewBtn.onclick = () => {
      const prefill = applyPhrase(displayedText, top.original_phrase, top.corrected_phrase);
      openCorrectionForm(bubble, displayedText, correction, btn, prefill);
    };
    note.appendChild(reviewBtn);
    bubble.appendChild(note);
  }
}

function openCorrectionForm(bubble, displayedText, correction, triggerBtn, prefill) {
  const existingForm = bubble.querySelector('.correction-form');
  if (existingForm) { existingForm.remove(); return; }

  const form = document.createElement('div');
  form.className = 'correction-form';
  const textarea = document.createElement('textarea');
  textarea.value = prefill !== undefined ? prefill : displayedText;
  const actions = document.createElement('div');
  actions.className = 'correction-actions';
  const saveBtn = document.createElement('button');
  saveBtn.className = 'save-btn';
  saveBtn.textContent = 'Save correction';
  // The feedback payload's original_text is always the raw STT output
  // (correction.rawText), even if the bubble is currently showing an
  // already auto-corrected version -- the immutable feedback record is
  // about what the model actually said, not what the user saw.
  saveBtn.onclick = () => submitCorrection(bubble, correction.rawText, textarea.value, correction, triggerBtn, form);
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'cancel-btn';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.onclick = () => form.remove();
  actions.appendChild(saveBtn);
  actions.appendChild(cancelBtn);
  form.appendChild(textarea);
  form.appendChild(actions);
  bubble.appendChild(form);
  textarea.focus();
}

async function submitCorrection(bubble, originalText, correctedTextRaw, correction, triggerBtn, form) {
  const correctedText = correctedTextRaw.trim();
  if (!correctedText || correctedText === originalText) { form.remove(); return; }
  try {
    const res = await fetch('/api/feedback', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        event_id: correction.eventId, profile_id: profileId, session_id: sessionId,
        original_text: originalText, corrected_text: correctedText,
        avg_logprob: correction.avgLogprob, language: correction.language,
      }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));

    form.remove();
    if (triggerBtn) triggerBtn.remove();
    bubble.querySelectorAll('.suggestion-note').forEach((n) => n.remove());
    const saved = document.createElement('span');
    saved.className = 'correction-saved';
    saved.textContent = '✓ Correction saved -- this helps future transcriptions for you.';
    bubble.appendChild(saved);
  } catch (err) {
    showToast('Could not save correction: ' + err.message, true);
  }
}

function addTypingIndicator() {
  hideEmptyState();
  const row = document.createElement('div');
  row.className = 'row assistant';
  row.id = 'typing-row';
  const avatar = document.createElement('div');
  avatar.className = 'avatar-sm';
  avatar.textContent = '🤖';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
  row.appendChild(avatar);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollToBottom();
  return bubble;
}

function addReplayButton(bubble, audioBlobs) {
  const replayBtn = document.createElement('button');
  replayBtn.className = 'replay-btn';
  replayBtn.textContent = '🔊 Replay';
  // .filter(Boolean) runs at CLICK time, not here -- audioBlobs is the same
  // array object pumpTtsQueue() keeps filling in as chunks finish
  // synthesizing, so a click shortly after the reply appears still gets
  // whatever's ready by then rather than a stale snapshot.
  replayBtn.onclick = () => playAudioBlobsSequentially(audioBlobs.filter(Boolean));

  const stopBtn = document.createElement('button');
  stopBtn.className = 'replay-btn';
  stopBtn.textContent = '⏹ Stop';
  stopBtn.onclick = () => stopSpeaking();

  bubble.appendChild(document.createElement('br'));
  bubble.appendChild(replayBtn);
  bubble.appendChild(stopBtn);
}

// ---- barge-in: only one assistant voice plays at a time, and starting a
// new turn (mic tap or typed message) always wins over whatever the
// assistant is still saying -- mirrors how ChatGPT/Claude voice cuts
// itself off the instant you start talking again. Replies are now spoken
// as a QUEUE of per-sentence audio chunks (see enqueueTtsChunk/
// pumpTtsQueue below) instead of one whole-reply blob, so barge-in has to
// clear that queue and cancel in-flight network calls too, not just pause
// one Audio element.
let currentAudio = null;
let currentPlaybackResolve = null; // resolves the in-flight playAndAwaitEnded promise, if any --
// pausing an Audio element never fires 'ended', so without this, stopSpeaking()
// mid-chunk would leave pumpTtsQueue's `await playAndAwaitEnded(...)` hanging forever.
let ttsGeneration = 0; // bumped on every new turn/barge-in; a pump loop compares its own
// captured value against the live one on each check -- immune to the boolean-flag
// reset race a plain "aborted" flag would have if a new turn starts before an old,
// still-unwinding pump instance finishes noticing it should stop.
let ttsQueue = [];            // [{ text, language }], drained strictly in order
let ttsQueueRunning = false;  // true while a pumpTtsQueue() loop is actively draining
let ttsAbortController = null;   // cancels in-flight/future /api/tts fetches for this turn
let llmAbortController = null;   // cancels the in-flight /api/respond fetch for this turn --
// kept SEPARATE from ttsAbortController so a single slow/timed-out TTS chunk can never
// accidentally cut off the LLM's still-streaming text reply.
let llmStreamFinished = false;   // true once /api/respond's reader loop + final flush are done
let replyAudioBlobs = [];        // this turn's chunks' blobs, in order, for the Replay button
let queueDrainedResolvers = [];  // called once the whole queue finishes (hands-free/wake re-arm)
let anyAudioStartedThisTurn = false; // true once this turn's speech actually started playing --
// lets stopSpeaking() tell "the user barged in on audio that was already talking" (expected,
// stay silent) apart from "the previous reply's TTS never even got a chance to play before the
// next turn started" (this is the failure mode that makes Tamil sound broken: its synthesis
// regularly takes 20-150s, far longer than a person takes to read a reply and ask the next
// question, so it loses this race almost every time -- worth telling the user about instead of
// discarding the audio with no explanation).

const SENTENCE_END_RE = /[.!?।॥]/;  // mirrors pipeline.py's _SENTENCE_END_RE (same 4 classes)

function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

// Called once at the start of every new thing the assistant is about to
// say (a streamed multi-sentence reply, or a single fixed-text reply like
// "please repeat that") -- resets all the per-turn state above.
function beginNewSpeechTurn() {
  ttsGeneration++;
  ttsAbortController = new AbortController();
  llmAbortController = new AbortController();
  llmStreamFinished = false;
  replyAudioBlobs = [];
  anyAudioStartedThisTurn = false;
  return ttsGeneration;
}

// reason: 'new-turn' when called because the user started talking/typing again
// (handleUserText/startRecording) -- as opposed to an explicit stop-button press or an
// about-to-replay call, where cutting off audio is the whole point and needs no explanation.
function stopSpeaking(reason) {
  // Capture before clearing: was this turn's reply still waiting to speak -- queued or
  // mid-fetch -- without ever having started? If so, "new-turn" is about to discard it
  // silently, which is exactly the failure mode worth surfacing (see anyAudioStartedThisTurn).
  const silentlyLosingUnplayedReply =
    reason === 'new-turn' && !anyAudioStartedThisTurn && (ttsQueueRunning || ttsQueue.length > 0);
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
  ttsGeneration++;   // invalidates any still-draining pump/replay loop immediately
  ttsQueue = [];
  queueDrainedResolvers = []; // the interrupted reply's re-arm hooks are moot now
  if (currentPlaybackResolve) {
    const resolve = currentPlaybackResolve;
    currentPlaybackResolve = null;
    resolve(); // unblocks a pump/replay loop that's mid-`await playAndAwaitEnded(...)`
  }
  // Real (server-visible) barge-in: aborting these actually cancels the
  // in-flight network calls, not just local playback -- an interrupted
  // reply stops burning the shared GPU/Ollama instead of finishing unheard.
  if (ttsAbortController) { ttsAbortController.abort(); ttsAbortController = null; }
  if (llmAbortController) { llmAbortController.abort(); llmAbortController = null; }
  if (silentlyLosingUnplayedReply) {
    showToast("Didn't get to speak the previous reply before you moved on -- its text is still above.", false);
  }
}

// Plays one blob and resolves once it's actually finished (native 'ended'),
// or once stopSpeaking() interrupts it (via currentPlaybackResolve), or if
// autoplay is blocked (never hangs the caller waiting on a rejected .play()).
function playAndAwaitEnded(blob) {
  return new Promise((resolve) => {
    anyAudioStartedThisTurn = true;
    currentPlaybackResolve = resolve;
    const audio = new Audio(URL.createObjectURL(blob));
    currentAudio = audio;
    const finish = () => {
      if (currentAudio === audio) currentAudio = null;
      if (currentPlaybackResolve === resolve) currentPlaybackResolve = null;
      resolve();
    };
    audio.addEventListener('ended', finish, { once: true });
    audio.play().catch(finish); // autoplay blocked -- don't hang the queue forever
  });
}

async function playAudioBlobsSequentially(blobs) {
  stopSpeaking(); // stop anything currently playing/queued first
  const myGeneration = ttsGeneration;
  for (const blob of blobs) {
    if (myGeneration !== ttsGeneration) break; // a new barge-in during replay stops replay too
    await playAndAwaitEnded(blob);
    if (myGeneration !== ttsGeneration) break;
  }
}

// The actual /api/tts network call, shared by every playback path below.
// Uses ttsAbortController (not llmAbortController) so a slow/timed-out TTS
// chunk can only cut off remaining speech, never the LLM's text stream.
async function fetchTtsBlob(text, language) {
  if (!ttsAbortController) return null;
  const controller = ttsAbortController;
  const signal = controller.signal;
  const timeoutMs = language === 'ta' ? TTS_TIMEOUT_MS_TA : TTS_TIMEOUT_MS;
  const timeoutId = setTimeout(() => {
    if (!signal.aborted) { controller._timedOut = true; controller.abort(); }
  }, timeoutMs);
  try {
    const res = await fetch('/api/tts', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, language: language || 'en' }),
      signal,
    });
    if (!res.ok) throw new Error((await res.json()).error || ('HTTP ' + res.status));
    return await res.blob();
  } catch (err) {
    if (err.name === 'AbortError') {
      // Distinguish this call's OWN timeout (worth telling the user about)
      // from a deliberate barge-in aborting it (expected, stay silent --
      // showing an error every time someone interrupts a reply would be
      // noisy and wrong).
      if (controller._timedOut) {
        showToast('Speech synthesis is taking too long -- showing text only for this reply.', true);
      }
    } else {
      showToast('TTS failed: ' + err.message, true);
    }
    return null;
  } finally {
    clearTimeout(timeoutId);
  }
}

// Drains ttsQueue strictly in order: fetch chunk N's audio, play it fully,
// then move to chunk N+1 -- but chunk N+1's TEXT may still be arriving
// from the LLM stream when this starts, so it polls briefly rather than
// giving up the moment the queue is momentarily empty (see llmStreamFinished).
// Only one instance actually runs at a time (ttsQueueRunning guards that);
// later enqueueTtsChunk() calls just add to the queue this same instance
// is already draining.
async function pumpTtsQueue(myGeneration) {
  if (ttsQueueRunning) return;
  ttsQueueRunning = true;
  while (myGeneration === ttsGeneration) {
    if (ttsQueue.length === 0) {
      if (llmStreamFinished) break; // truly done -- no more sentences are coming
      await sleep(50); // LLM hasn't produced the next sentence yet -- wait briefly and re-check
      continue;
    }
    const item = ttsQueue.shift();
    const idx = replyAudioBlobs.findIndex((b) => b === null);
    const blob = await fetchTtsBlob(item.text, item.language);
    if (myGeneration !== ttsGeneration) break;
    if (blob) {
      if (idx >= 0) replyAudioBlobs[idx] = blob;
      await playAndAwaitEnded(blob);
      if (myGeneration !== ttsGeneration) break;
    }
  }
  ttsQueueRunning = false;
  if (ttsQueue.length > 0) {
    // A newer turn's chunks arrived while this instance was exiting (generation
    // mismatch) -- hand off to a fresh pump for the CURRENT generation instead
    // of stranding them unpumped.
    pumpTtsQueue(ttsGeneration);
    return;
  }
  if (myGeneration === ttsGeneration) {
    const resolvers = queueDrainedResolvers;
    queueDrainedResolvers = [];
    resolvers.forEach((resolve) => resolve());
  }
}

function enqueueTtsChunk(text, language) {
  if (!text.trim()) return;
  ttsQueue.push({ text, language });
  replyAudioBlobs.push(null); // placeholder -- keeps index alignment as chunks finish out of the enqueue order
  pumpTtsQueue(ttsGeneration);
}

// Single-utterance playback (the "please repeat that" reply, the wake-
// phrase-alone chime's own recording restart) -- routes through the same
// abort-aware fetch + playback primitives as the streaming path above, so
// these get real cancelable barge-in too, without a second code path.
// Mirrors the old synthesizeAndPlay()'s timing: awaits only the network
// fetch, then plays in the background (doesn't block the caller on
// playback finishing) -- callers that need to know "did this actually
// speak" get that from the awaited return value, not from playback timing.
async function synthesizeAndPlay(text, language) {
  beginNewSpeechTurn();
  llmStreamFinished = true; // exactly one chunk, nothing more is ever coming
  replyAudioBlobs = [null];
  const myGeneration = ttsGeneration;
  const blob = await fetchTtsBlob(text, language);
  if (myGeneration !== ttsGeneration || !blob) return null;
  replyAudioBlobs[0] = blob;
  playAndAwaitEnded(blob).then(() => {
    if (myGeneration !== ttsGeneration) return;
    const resolvers = queueDrainedResolvers;
    queueDrainedResolvers = [];
    resolvers.forEach((resolve) => resolve());
  });
  return replyAudioBlobs;
}

// Call right after a reply's speech has been queued/started, for a reply
// that should continue the conversation in hands-free mode. Fires once the
// WHOLE queue has finished playing (queueDrainedResolvers), not just the
// first chunk -- with multi-sentence streaming speech, re-arming on chunk
// 1's end would reopen the mic while chunks 2+ are still playing.
function hookHandsFreeRestart() {
  queueDrainedResolvers.push(() => {
    if (handsFreeMode && !isRecording && !isBusy) startRecording();
  });
}

// Sibling to hookHandsFreeRestart -- only acts if hands-free ISN'T also
// driving the conversation (hands-free wins: it already keeps things
// going without re-requiring the wake phrase). Also fires only once the
// whole reply has finished speaking, for the same reason -- and, as
// before, arming this way (rather than synchronously when the reply
// STARTS) prevents an echo-tainted false wake-detection from cutting the
// reply off mid-sentence via startRecording()'s own stopSpeaking() call.
function hookWakeWordRestart() {
  queueDrainedResolvers.push(() => {
    if (wakeWordMode && !handsFreeMode && !isRecording && !isBusy) startWakeListening();
  });
}

function applyWhisperDevice(device) {
  if (device) setStatus('ok', 'Ready · STT on ' + device.toUpperCase());
}

async function checkHealth() {
  try {
    const res = await fetch('/api/health');
    const data = await res.json();
    // Whisper loads lazily on the first transcription request, so
    // whisper_device is still null right after the server starts --
    // showing "STT on ?" here would look broken rather than pending.
    // The badge fills in for real once /api/transcribe reports a device.
    if (data.whisper_device) {
      applyWhisperDevice(data.whisper_device);
    } else {
      setStatus('ok', 'Ready');
    }
  } catch (err) {
    setStatus('err', 'Server unreachable');
  }
}

// Without a client-side cap, a stuck request just leaves "Speaking..."
// on screen forever with no sound and no explanation. Tamil gets a
// much longer allowance than English/Hindi: it runs in its own worker
// process (see pipeline.py's synthesize_tamil_via_worker), and the
// FIRST request after that worker (re)spawns has to pay Python
// interpreter startup + import (torch, coqui-tts, numba JIT
// compilation) + model load from disk, ALL from scratch as a brand new
// OS process -- measured live at ~35s, meaningfully slower than
// reusing an already-warm Python process for the same load (~3-5s,
// which is what an earlier, too-tight version of this timeout was
// based on -- a real bug: it caused every cold-worker Tamil TTS call to
// get silently aborted client-side 5+ seconds before the server would
// have actually succeeded). Every request after that first one is fast
// (~1.5-2s per sentence, CPU-only), but the client can't tell a cold
// spawn from a genuine hang in advance, so this stays generous with
// real margin above the measured 35s cold case, not tight against it.
const TTS_TIMEOUT_MS = 15000;
const TTS_TIMEOUT_MS_TA = 100000; // stays above pipeline.py's _INDIC_WORKER_TIMEOUT_S (90s) so a
// truly-hung worker gets reported by the SERVER's own clear error message, not a client-side
// AbortError with no detail -- see that constant's comment for the measured numbers this is based on.

// Streams the LLM's reply and speaks it sentence-by-sentence as it
// arrives, instead of waiting for the whole reply to finish generating
// AND the whole thing to finish synthesizing before any audio plays --
// the actual latency fix this whole redesign is for. Sentence 1's
// /api/tts call fires while the LLM is still generating sentence 3.
//
// Tamil used to be excluded from this (kept to ONE /api/tts call for the
// whole reply) because its old engine (indic-parler-tts) ran through a
// single, slow (20-150s), crash-isolated worker process serialized
// behind chat_web.py's _gpu_lock -- several of those uninterruptible
// calls per reply could pile up behind each other across turns and go
// silently missing. The current engine (AI4Bharat FastPitch+HiFiGAN, see
// indic_tts.py) is fast enough on CPU (~1.5-2s/sentence) that this
// pile-up risk is no longer real, so Tamil now gets the same real-time,
// sentence-by-sentence streaming as English/Hindi.
const CHUNKED_LANGUAGES = new Set(['en', 'hi', 'ta']);

async function sendToLLM(userText, language) {
  language = language || (selectedLanguage === 'auto' ? 'en' : selectedLanguage);
  const chunked = CHUNKED_LANGUAGES.has(language);
  isBusy = true;
  setControlsEnabled(false);
  setLive('Thinking...');
  const typingBubble = addTypingIndicator();
  let fullText = '';
  let sentenceBuffer = ''; // unflushed tail since the last sentence boundary (chunked languages only)
  let anyChunkQueued = false;
  beginNewSpeechTurn();
  const thisReplyBlobs = replyAudioBlobs; // snapshot the array object itself (see addReplayButton)
  try {
    const res = await fetch('/api/respond', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: userText, history, language }),
      signal: llmAbortController.signal, // barge-in cancels the still-streaming reply too
    });
    if (!res.body) throw new Error('Streaming not supported by this browser.');
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let first = true;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const piece = decoder.decode(value, { stream: true });
      if (!piece) continue;
      if (first) { typingBubble.textContent = ''; first = false; setLive('Speaking...'); }
      fullText += piece;
      typingBubble.textContent = fullText;
      scrollToBottom();

      if (!chunked) continue; // not a CHUNKED_LANGUAGES entry: keep accumulating, speak as one call below

      // Slice off every complete sentence found so far and queue it for
      // speech immediately -- don't wait for the reply to finish.
      sentenceBuffer += piece;
      let match;
      while ((match = SENTENCE_END_RE.exec(sentenceBuffer))) {
        const boundary = match.index + 1;
        const sentence = sentenceBuffer.slice(0, boundary).trim();
        sentenceBuffer = sentenceBuffer.slice(boundary);
        if (sentence) { enqueueTtsChunk(sentence, language); anyChunkQueued = true; }
      }
    }
    if (!fullText.trim()) fullText = '(no response)';
    if (chunked) {
      if (sentenceBuffer.trim()) { enqueueTtsChunk(sentenceBuffer.trim(), language); anyChunkQueued = true; }
    } else if (fullText.trim()) {
      enqueueTtsChunk(fullText.trim(), language); // not a CHUNKED_LANGUAGES entry: one call for the whole reply
      anyChunkQueued = true;
    }
    llmStreamFinished = true; // tells pumpTtsQueue "nothing more is coming" so it can stop polling
    history.push({ role: 'user', content: userText });
    history.push({ role: 'assistant', content: fullText });

    if (anyChunkQueued) {
      addReplayButton(typingBubble, thisReplyBlobs);
      hookHandsFreeRestart();
      hookWakeWordRestart();
    }
  } catch (err) {
    llmStreamFinished = true;
    if (err.name !== 'AbortError') {
      typingBubble.textContent = 'Error: ' + err.message;
      showToast(err.message, true);
    }
  } finally {
    setLive('');
    isBusy = false;
    setControlsEnabled(true);
    document.getElementById('typing-row')?.removeAttribute('id');
    if (!anyChunkQueued) maybeRearmWakeListening(); // nothing was ever queued -- safe to re-arm now
  }
}

async function handleUserText(text) {
  text = text.trim();
  if (!text) return;
  stopSpeaking('new-turn');
  stopWakeListening();
  addRow('user', text);
  await sendToLLM(text);
}

function setControlsEnabled(enabled) {
  btnSend.disabled = !enabled;
  btnMic.disabled = !enabled;
  textInput.disabled = !enabled;
}

// ---- text input ----
btnSend.addEventListener('click', () => {
  const text = textInput.value;
  textInput.value = '';
  textInput.style.height = 'auto';
  handleUserText(text);
});
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    btnSend.click();
  }
});
textInput.addEventListener('input', () => {
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
});

// ---- voice input ----
function pickMimeType() {
  const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/ogg'];
  for (const c of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}

async function ensureMic() {
  if (stream) return stream;
  // Explicit echo-cancellation/noise-suppression constraints matter more
  // now that hands-free mode can start listening moments after this same
  // machine's speakers finish playing the assistant's voice -- without
  // this, a speaker (not headphone) setup risks the mic picking up its
  // own TTS output and transcribing it as if the user said it.
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  });
  return stream;
}

// ---- silence-detection auto-stop (VAD) ----
// Deliberately a simple RMS-energy threshold, not a ported webrtcvad/WASM
// VAD model -- same "boring, tunable code over ML dependency" philosophy
// as src/learning/'s deterministic correction engine. These mirror the
// CLI's tuned values in src/pipeline.py / src/config.py so both
// interfaces feel the same; retune by editing the numbers below (no
// client-side .env mechanism exists -- index.html is served as a static
// file with no templating, see src/chat_web.py). No pre-roll/padding is
// needed here (unlike the CLI's PRE_SPEECH_PADDING_FRAMES): MediaRecorder
// already captures continuously from the moment recording starts, so
// there's no "trim before speech" problem to solve.
const VAD_CHECK_MS = 30;            // analysis cadence, matches pipeline.py FRAME_MS
const VAD_SILENCE_MS_TO_STOP = 800; // trailing silence before auto-stop, matches SILENCE_FRAMES_TO_STOP (~0.8s)
const VAD_MIN_SPEECH_MS = 150;      // ignore blips shorter than this, matches MIN_SPEECH_FRAMES
const VAD_MAX_RECORD_MS = 15000;    // hard safety cap, matches MAX_RECORD_SECONDS

// A single hardcoded RMS threshold here previously required tuning by hand
// against one specific mic/room and silently failed (never triggering, or
// triggering on room noise) on anyone else's -- this is what actually broke
// hands-free/wake-word for most setups, since both rely ENTIRELY on this
// threshold to auto-detect speech (unlike the manual mic button, which the
// user triggers themselves and so never depended on it to *start*).
// Adapts instead: a slow-moving estimate of the current ambient noise floor
// (updated only during frames judged non-speech) sets the bar, so it
// calibrates itself to whatever mic/room/gain this browser actually has.
let noiseFloorEma = 0.004;         // running idle-mic RMS estimate, adapts live
const NOISE_FLOOR_EMA_ALPHA = 0.05; // smoothing factor -- slow, so a single
                                     // loud moment can't drag the floor up
const SPEECH_MARGIN = 3.0;          // speech must exceed the floor by this factor
const VAD_RMS_ABS_FLOOR = 0.006;    // absolute minimum threshold, so a truly
                                     // silent room doesn't make the floor so
                                     // low that electrical noise reads as speech

function currentSpeechThreshold() {
  return Math.max(VAD_RMS_ABS_FLOOR, noiseFloorEma * SPEECH_MARGIN);
}

let audioCtx = null;
let analyser = null;
let vadTimerId = null;
let vadBuf = null;

function ensureVadAnalyser() {
  if (analyser) return analyser;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  vadBuf = new Float32Array(analyser.fftSize);
  source.connect(analyser); // not connected to destination -- no audible feedback
  return analyser;
}

function readRms() {
  analyser.getFloatTimeDomainData(vadBuf);
  let sumSquares = 0;
  for (let i = 0; i < vadBuf.length; i++) sumSquares += vadBuf[i] * vadBuf[i];
  return Math.sqrt(sumSquares / vadBuf.length);
}

function checkVadFrame(state) {
  const rms = readRms();
  const threshold = currentSpeechThreshold();
  const isSpeech = rms > threshold;
  if (!isSpeech) noiseFloorEma += NOISE_FLOOR_EMA_ALPHA * (rms - noiseFloorEma);

  state.elapsedMs += VAD_CHECK_MS;

  if (isSpeech) {
    state.speechMs += VAD_CHECK_MS;
    state.silenceMs = 0;
    if (state.speechMs >= VAD_MIN_SPEECH_MS) state.speechDetected = true;
  } else {
    state.silenceMs += VAD_CHECK_MS;
  }

  const trailingSilenceHit = state.speechDetected && state.silenceMs >= VAD_SILENCE_MS_TO_STOP;
  const maxDurationHit = state.elapsedMs >= VAD_MAX_RECORD_MS;
  if (trailingSilenceHit || maxDurationHit) {
    stopRecording(); // same path the manual-stop click uses
  }
}

function startVad() {
  try {
    ensureVadAnalyser();
  } catch (err) {
    // Web Audio unavailable/blocked -- degrade silently to manual-stop-only.
    return;
  }
  const state = { elapsedMs: 0, speechMs: 0, silenceMs: 0, speechDetected: false };
  vadTimerId = setInterval(() => checkVadFrame(state), VAD_CHECK_MS);
}

function stopVad() {
  if (vadTimerId !== null) {
    clearInterval(vadTimerId);
    vadTimerId = null;
  }
}

// ---- wake-word idle listening ----------------------------------------
// Reuses the SAME analyser singleton as the in-recording VAD -- no second
// getUserMedia/AudioContext. While armed, this only watches for "has
// speech started"; the instant it does, it hands off to the EXISTING
// startRecording()/startVad() pipeline, so the clip is captured and
// auto-stopped exactly like a real command. pendingWakeCheck tells
// onRecordingStopped() to check the transcript for the wake phrase
// instead of running the normal accept/reject/LLM flow. Hardcoded,
// tunable constants -- same idiom as the noise-floor constants above;
// this app has no settings UI/backend to expose these through.
let wakeTimerId = null;
let pendingWakeCheck = false; // true while the CURRENT recording exists only to check for the wake phrase

const WAKE_PHRASES = ['hey chatbot', 'hi chatbot', 'hey chat bot', 'ok chatbot'];
const WAKE_LEADING_SLOP_CHARS = 12; // tolerate a little leading noise/filler before the phrase

function buildWakePhraseRegexes() {
  return WAKE_PHRASES.map((phrase) => {
    const words = phrase.split(' ').map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    // tolerates STT inserting punctuation/extra whitespace between words,
    // e.g. "Hey, Chatbot" or "hey  chatbot" both still match.
    return new RegExp(words.join('[,.\\s]+') + '\\b', 'i');
  });
}
const WAKE_PHRASE_REGEXES = buildWakePhraseRegexes();

// Matches against text.toLowerCase() (same length/index as the original
// for this alphabet), so the match position can be used directly to
// slice the ORIGINAL text for the remainder -- preserving real
// capitalization/punctuation for whatever gets sent on to the LLM.
function matchWakePhrase(rawText) {
  const lower = rawText.toLowerCase();
  let best = null;
  for (const re of WAKE_PHRASE_REGEXES) {
    const m = re.exec(lower);
    if (m && (best === null || m.index < best.index)) best = m;
  }
  if (!best || best.index > WAKE_LEADING_SLOP_CHARS) return { hasWake: false, remainder: '' };
  const remainder = rawText.slice(best.index + best[0].length).replace(/^[,.\s]+/, '').trim();
  return { hasWake: true, remainder };
}

// Same cumulative-speechMs accumulation style as checkVadFrame (a brief
// dip below threshold doesn't reset progress), and the same adaptive
// threshold -- idle wake-listening is exactly where the noise floor most
// needs to keep calibrating (it runs far longer than any one recording).
function checkWakeFrame(state) {
  const rms = readRms();
  const isSpeech = rms > currentSpeechThreshold();
  if (!isSpeech) noiseFloorEma += NOISE_FLOOR_EMA_ALPHA * (rms - noiseFloorEma);
  if (isSpeech) state.speechMs += VAD_CHECK_MS;
  if (state.speechMs >= VAD_MIN_SPEECH_MS) {
    stopWakeListening();
    pendingWakeCheck = true;
    startRecording();
  }
}

function startWakeListening() {
  if (!wakeWordMode || isRecording || isBusy || wakeTimerId !== null) return;
  try {
    ensureVadAnalyser();
  } catch (err) {
    return; // Web Audio unavailable/blocked -- degrade silently, same as startVad()
  }
  const state = { speechMs: 0 };
  wakeTimerId = setInterval(() => checkWakeFrame(state), VAD_CHECK_MS);
  setLive('👂 Say "hey chatbot"...');
}

function stopWakeListening() {
  if (wakeTimerId !== null) {
    clearInterval(wakeTimerId);
    wakeTimerId = null;
  }
  if (liveStatus.textContent === '👂 Say "hey chatbot"...') setLive('');
}

// Re-arm point for every place the app returns to a fully idle state.
// Hands-free (an active conversation already in progress) always wins --
// its own hookHandsFreeRestart() already keeps things going without
// requiring the wake phrase again, matching how real assistants don't
// make you re-say the wake word mid-conversation.
function maybeRearmWakeListening() {
  if (wakeWordMode && !handsFreeMode && !isRecording && !isBusy) startWakeListening();
}

function playWakeChime() {
  return new Promise((resolve) => {
    try {
      ensureVadAnalyser(); // guarantees audioCtx exists; no second AudioContext
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
      osc.onended = resolve;
    } catch (err) {
      resolve(); // chime is a nicety, never block on it
    }
  });
}

async function startRecording() {
  stopWakeListening();
  stopSpeaking('new-turn');
  try {
    await ensureMic();
  } catch (err) {
    showToast('Microphone access denied: ' + err.message, true);
    return;
  }
  chunks = [];
  const mimeType = pickMimeType();
  mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
  mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
  mediaRecorder.onstop = onRecordingStopped;
  mediaRecorder.start();
  isRecording = true;
  btnMic.classList.add('recording');
  btnMic.textContent = '⏹';
  setLive('Listening... tap to stop');
  startVad();
}

function stopRecording() {
  if (!isRecording) return;
  stopVad();
  mediaRecorder.stop();
  isRecording = false;
  btnMic.classList.remove('recording');
  btnMic.textContent = '🎤';
}

btnMic.addEventListener('click', () => {
  if (isBusy) return;
  if (!isRecording) startRecording();
  else stopRecording();
});

btnHandsFree.addEventListener('click', async () => {
  handsFreeMode = !handsFreeMode;
  btnHandsFree.classList.toggle('active', handsFreeMode);
  btnHandsFree.title = handsFreeMode
    ? 'Hands-free mode is ON: tap to turn off'
    : 'Hands-free mode: keep listening after each reply';
  showToast(handsFreeMode
    ? 'Hands-free mode on -- listening now, and after every reply. Headphones recommended to avoid it hearing its own voice.'
    : 'Hands-free mode off.');
  if (handsFreeMode) {
    // Starts listening immediately, the same way tapping the mic does --
    // otherwise turning this on gives no feedback at all until the FIRST
    // reply finishes, which reads as "nothing happened" / broken.
    if (!isRecording && !isBusy) {
      try {
        await startRecording();
      } catch (err) {
        showToast('Microphone access denied: ' + err.message, true);
      }
    }
  } else {
    if (isRecording && !pendingWakeCheck) stopRecording();
    maybeRearmWakeListening(); // no-op unless wake-word is also on
  }
});

btnWakeWord.addEventListener('click', async () => {
  if (!wakeWordMode) {
    try {
      await ensureMic();
    } catch (err) {
      showToast('Microphone access denied: ' + err.message, true);
      return;
    }
    wakeWordMode = true;
    btnWakeWord.classList.add('active');
    btnWakeWord.title = 'Wake-word mode is ON: tap to turn off';
    showToast('Wake-word mode on -- say "hey chatbot" to start listening. Nothing leaves this machine; background speech is transcribed locally and discarded if it doesn\'t match.');
    if (!isRecording && !isBusy) startWakeListening();
  } else {
    wakeWordMode = false;
    btnWakeWord.classList.remove('active');
    btnWakeWord.title = 'Wake-word mode: say "hey chatbot" to start listening';
    stopWakeListening();
    showToast('Wake-word mode off.');
  }
});

async function onRecordingStopped() {
  const wasWakeCheck = pendingWakeCheck;
  pendingWakeCheck = false;
  const mimeType = mediaRecorder.mimeType || 'audio/webm';
  const blob = new Blob(chunks, { type: mimeType });
  if (blob.size < 800) {
    setLive('');
    if (wasWakeCheck) {
      maybeRearmWakeListening();
    } else {
      showToast('Recording too short.', true);
    }
    return;
  }
  isBusy = true;
  setControlsEnabled(false);
  setLive(wasWakeCheck ? 'Checking for wake phrase...' : 'Transcribing...');
  try {
    const form = new FormData();
    const ext = mimeType.includes('ogg') ? 'ogg' : 'webm';
    form.append('audio', blob, `clip.${ext}`);
    form.append('profile_id', profileId);
    form.append('session_id', sessionId);
    form.append('language', selectedLanguage);
    const res = await fetch('/api/transcribe', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
    applyWhisperDevice(data.whisper_device); // fills in "STT on ?" once known

    if (wasWakeCheck) {
      const { hasWake, remainder } = matchWakePhrase(data.text || '');
      if (!hasWake) {
        setLive('');
        isBusy = false;
        setControlsEnabled(true);
        maybeRearmWakeListening();
        return;
      }
      if (remainder) {
        // one-shot "hey chatbot, what's the weather" -- remainder is the
        // real command, same shape as the existing accepted branch.
        addRow('user', remainder, { meta: 'via wake phrase' });
        isBusy = false; // sendToLLM will re-lock controls
        await sendToLLM(remainder, data.language);
        return;
      }
      // wake phrase said alone -- chime, then open a normal full recording
      // (pendingWakeCheck stays false: normal accept/reject/LLM flow)
      await playWakeChime();
      isBusy = false;
      setControlsEnabled(true);
      startRecording();
      return;
    }

    if (!data.accepted) {
      addRow('rejected', '"' + data.text + '"', { meta: `low confidence (${data.avg_logprob.toFixed(2)}) -- not sent to the model` });
      setLive('');
      const askAgain = "Sorry, could you say that again?";
      const bubble = addRow('assistant', askAgain);
      const clip = await synthesizeAndPlay(askAgain);
      if (clip) {
        addReplayButton(bubble, clip);
        hookHandsFreeRestart();
        hookWakeWordRestart();
      }
      isBusy = false;
      setControlsEnabled(true);
      if (!clip) maybeRearmWakeListening();
      return;
    }

    // data.event_id is only present when the server has the continuous-
    // learning layer enabled (CONFIG.learning_enabled) -- the correction
    // affordance only appears in that case. data.text is already the
    // auto-corrected transcript if the server applied one with high
    // enough confidence; data.original_text carries the raw STT output.
    let meta = `confidence ${data.avg_logprob.toFixed(2)}`;
    if (data.auto_corrected) meta += ' · auto-corrected from memory';
    const correctionOpts = data.event_id ? {
      eventId: data.event_id,
      avgLogprob: data.avg_logprob,
      rawText: data.original_text || data.text,
      suggestions: data.correction_suggestions || [],
      language: data.language,
    } : null;
    addRow('user', data.text, { meta, correction: correctionOpts });
    isBusy = false; // sendToLLM will re-lock controls
    await sendToLLM(data.text, data.language);
  } catch (err) {
    showToast(err.message, true);
    setLive('');
    isBusy = false;
    setControlsEnabled(true);
    maybeRearmWakeListening(); // a network hiccup shouldn't permanently kill wake-listening
  }
}

checkHealth();
</script>
</body>
</html>
